services:
  shelf:
    build: .
    container_name: shelf
    ports:
      - "8080:8080"
    environment:
      ROOT_DIR: /data/library
      CACHE_DIR: /data/cache
      SCAN_INTERVAL: 15m        # set 0 to scan once at boot and rely on the Scan button
      WORKER_CONCURRENCY: "4"   # parallel indexers; raise on multi-core boxes
      THUMB_WIDTH: "400"
    volumes:
      # Your archive root, mounted READ-ONLY — the source of truth is never written to.
      - ${LIBRARY_PATH:?set LIBRARY_PATH in .env to your archive root}:/data/library:ro
      # Regenerable cache (index.db + covers) and the small durable user.db.
      - shelf-cache:/data/cache
    restart: unless-stopped

volumes:
  shelf-cache:
