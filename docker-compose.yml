services:
  shelf:
    build: .
    container_name: shelf
    ports:
      - "8080:8080"
    environment:
      ROOT_DIR: /data/library
      CACHE_DIR: /data/cache
      PUID: "${PUID:-1000}"      # `id -u` of the account that owns your archives
      PGID: "${PGID:-1000}"      # `id -g`
      SCAN_INTERVAL: 15m         # set 0 to scan once at boot and rely on the Scan button
      WORKER_CONCURRENCY: "4"    # parallel indexers; raise on multi-core boxes
      THUMB_WIDTH: "400"
    volumes:
      # Your archive root -> where the app looks inside the container. READ-ONLY.
      - ${LIBRARY_PATH:?set LIBRARY_PATH in .env to your archive root}:/data/library:ro
      # Your cache folder -> where the app writes index.db, covers/, and user.db.
      # Created if missing; owned by PUID:PGID at startup so no manual chown.
      - ${CACHE_PATH:-./cache}:/data/cache
    restart: unless-stopped
