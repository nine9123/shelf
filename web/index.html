<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shelf</title>
<style>
  :root{
    --bg:#17181c; --panel:#1f2026; --panel-2:#26272e; --line:#31333c;
    --text:#e8e6df; --muted:#9a9aa2; --accent:#d8a53a; --accent-dim:#8a6c22;
    --radius:10px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--text);
    font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  button{font:inherit;color:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--panel-2);border-radius:8px;padding:.45rem .7rem}
  button:hover{border-color:#484a55}
  input[type=search]{font:inherit;color:inherit;background:var(--panel);
    border:1px solid var(--line);border-radius:8px;padding:.5rem .75rem;min-width:min(360px,55vw)}
  header{position:sticky;top:0;z-index:5;display:flex;gap:.75rem;align-items:center;flex-wrap:wrap;
    padding:.8rem 1.1rem;background:rgba(23,24,28,.92);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line)}
  .brand{font-weight:600;letter-spacing:.02em;font-size:1.15rem;margin-right:.3rem}
  .brand span{color:var(--accent)}
  .spacer{flex:1}
  .status{color:var(--muted);font-size:.85rem;min-width:11ch;text-align:right}
  .toggle[aria-pressed=true]{border-color:var(--accent-dim);color:var(--accent)}
  main{padding:1.1rem}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:1.1rem}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    overflow:hidden;display:flex;flex-direction:column}
  .cover{position:relative;aspect-ratio:2/3;background:var(--panel-2);cursor:pointer;width:100%}
  .cover img{width:100%;height:100%;object-fit:cover;display:block}
  .cover .ph{position:absolute;inset:0;display:grid;place-items:center;color:#5a5c66;font-size:.8rem}
  .fav{position:absolute;top:.4rem;right:.4rem;width:32px;height:32px;padding:0;border-radius:50%;
    background:rgba(0,0,0,.5);border:none;line-height:1;font-size:1rem;color:#fff;display:grid;place-items:center}
  .fav:hover{background:rgba(0,0,0,.7)}
  .fav[aria-pressed=true]{color:var(--accent)}
  .meta{padding:.55rem .6rem}
  .title{font-size:.85rem;line-height:1.3;max-height:2.6em;overflow:hidden}
  .sub{color:var(--muted);font-size:.72rem;margin-top:.2rem}
  .empty{color:var(--muted);text-align:center;padding:4rem 1rem}

  /* reader */
  .reader{position:fixed;inset:0;z-index:20;background:#0c0c0e;display:none;flex-direction:column}
  .reader.open{display:flex}
  .rbar{display:flex;gap:.6rem;align-items:center;padding:.5rem .8rem;
    background:rgba(20,20,24,.94);border-bottom:1px solid var(--line);height:52px}
  .rtitle{font-size:.9rem;max-width:36vw;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  .rstage{flex:1;overflow:auto;display:flex;justify-content:center;background:#0c0c0e}
  .rstage.fitH{align-items:center}
  .rstage.fitW{align-items:flex-start}
  .rstage img{display:block}
  .rstage.fitH img{max-height:calc(100vh - 52px);width:auto}
  .rstage.fitW img{width:100%;height:auto}
  .pageind{min-width:8ch;text-align:center;color:var(--muted);font-size:.85rem}
  .navzone{position:fixed;top:52px;bottom:0;width:22%;z-index:21;cursor:pointer}
  .navzone.left{left:0}
  .navzone.right{right:0}
  @media (max-width:640px){.rtitle{display:none}}
</style>
</head>
<body>
  <header>
    <div class="brand">Shelf<span>.</span></div>
    <input id="q" type="search" placeholder="Search title, notes, path…" autocomplete="off">
    <button id="favBtn" class="toggle" aria-pressed="false">Favorites</button>
    <div class="spacer"></div>
    <div id="status" class="status"></div>
    <button id="scanBtn">Scan</button>
  </header>

  <main>
    <div id="grid" class="grid"></div>
    <div id="empty" class="empty" hidden></div>
  </main>

  <div id="reader" class="reader" aria-hidden="true">
    <div class="rbar">
      <button id="rClose">← Library</button>
      <div id="rTitle" class="rtitle"></div>
      <div class="spacer"></div>
      <button id="rFav" class="toggle" aria-pressed="false" title="Favorite">♥</button>
      <button id="rDir" class="toggle" aria-pressed="false" title="Reading direction">LTR</button>
      <button id="rFit" class="toggle" title="Fit">Fit height</button>
      <button id="rPrev">Prev</button>
      <div id="rInd" class="pageind"></div>
      <button id="rNext">Next</button>
    </div>
    <div id="rStage" class="rstage fitH"><img id="rImg" alt=""></div>
    <div class="navzone left" id="navL"></div>
    <div class="navzone right" id="navR"></div>
  </div>

<script>
  const $ = s => document.querySelector(s);
  const api = (p, opt) => fetch(p, opt);

  const state = { q:'', fav:false };
  const reader = { id:null, page:0, count:0, rtl:false, fitH:true };

  async function loadList(){
    const params = new URLSearchParams();
    if(state.q) params.set('q', state.q);
    if(state.fav) params.set('fav','1');
    const data = await (await api('/api/archives?' + params.toString())).json();
    renderGrid(data.items || []);
  }

  function renderGrid(items){
    const grid = $('#grid'), empty = $('#empty');
    grid.innerHTML = '';
    if(items.length === 0){
      empty.hidden = false;
      empty.textContent = state.fav
        ? 'No favorites yet. Tap ♥ on a cover to save one.'
        : (state.q ? 'Nothing matches your search.' : 'Nothing indexed yet. Add archives and press Scan.');
      return;
    }
    empty.hidden = true;
    for(const it of items){
      const card = el('div','card');
      const cover = el('div','cover');
      if(it.hasCover){
        const img = el('img'); img.loading='lazy';
        img.src = '/api/archives/' + it.id + '/cover'; img.alt = it.title || '';
        cover.appendChild(img);
      } else {
        cover.appendChild(Object.assign(el('div','ph'), {textContent:'no cover'}));
      }
      const fav = el('button','fav'); fav.textContent='♥'; fav.title='Favorite';
      fav.setAttribute('aria-pressed', it.favorite ? 'true' : 'false');
      fav.addEventListener('click', async e => {
        e.stopPropagation();
        const on = fav.getAttribute('aria-pressed') === 'true';
        await api('/api/archives/' + it.id + '/favorite', { method: on ? 'DELETE' : 'PUT' });
        it.favorite = !on;
        fav.setAttribute('aria-pressed', it.favorite ? 'true' : 'false');
        if(state.fav && !it.favorite) loadList();
      });
      cover.appendChild(fav);
      cover.addEventListener('click', () => openReader(it.id));

      const meta = el('div','meta');
      meta.appendChild(Object.assign(el('div','title'), {textContent: it.title || '(untitled)'}));
      meta.appendChild(Object.assign(el('div','sub'), {textContent: it.pageCount + ' pages'}));

      card.appendChild(cover); card.appendChild(meta);
      grid.appendChild(card);
    }
  }

  async function openReader(id){
    const r = await api('/api/archives/' + id);
    if(!r.ok) return;
    const d = await r.json();
    reader.id = id;
    reader.count = d.pageCount;
    reader.page = Math.min(d.lastPage || 0, Math.max(0, d.pageCount - 1));
    $('#rTitle').textContent = d.title || '';
    $('#rFav').setAttribute('aria-pressed', d.favorite ? 'true' : 'false');
    $('#reader').classList.add('open');
    $('#reader').setAttribute('aria-hidden','false');
    renderPage();
  }

  function renderPage(){
    if(reader.id == null) return;
    $('#rImg').src = '/api/archives/' + reader.id + '/page/' + reader.page;
    $('#rInd').textContent = (reader.page + 1) + ' / ' + reader.count;
    preload(reader.page + 1);
    saveProgress();
  }

  function preload(n){
    if(n >= 0 && n < reader.count){ const i = new Image(); i.src = '/api/archives/' + reader.id + '/page/' + n; }
  }

  function go(delta){
    const p = reader.page + delta;
    if(p < 0 || p >= reader.count) return;
    reader.page = p;
    renderPage();
  }

  let saveT;
  function saveProgress(){
    clearTimeout(saveT);
    const id = reader.id, page = reader.page;
    saveT = setTimeout(() => {
      api('/api/archives/' + id + '/progress',
        { method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ page }) });
    }, 600);
  }

  function closeReader(){
    $('#reader').classList.remove('open');
    $('#reader').setAttribute('aria-hidden','true');
    $('#rImg').src = '';
    reader.id = null;
  }

  /* controls */
  $('#q').addEventListener('input', e => {
    state.q = e.target.value.trim();
    clearTimeout(window._qt);
    window._qt = setTimeout(loadList, 220);
  });
  $('#favBtn').addEventListener('click', e => {
    state.fav = !state.fav;
    e.currentTarget.setAttribute('aria-pressed', state.fav ? 'true' : 'false');
    loadList();
  });
  $('#rClose').addEventListener('click', closeReader);
  $('#rPrev').addEventListener('click', () => go(-1));
  $('#rNext').addEventListener('click', () => go(1));
  $('#navL').addEventListener('click', () => go(reader.rtl ? 1 : -1));
  $('#navR').addEventListener('click', () => go(reader.rtl ? -1 : 1));
  $('#rFit').addEventListener('click', e => {
    reader.fitH = !reader.fitH;
    $('#rStage').className = 'rstage ' + (reader.fitH ? 'fitH' : 'fitW');
    e.currentTarget.textContent = reader.fitH ? 'Fit height' : 'Fit width';
  });
  $('#rDir').addEventListener('click', e => {
    reader.rtl = !reader.rtl;
    e.currentTarget.setAttribute('aria-pressed', reader.rtl ? 'true' : 'false');
    e.currentTarget.textContent = reader.rtl ? 'RTL' : 'LTR';
  });
  $('#rFav').addEventListener('click', async e => {
    const on = e.currentTarget.getAttribute('aria-pressed') === 'true';
    await api('/api/archives/' + reader.id + '/favorite', { method: on ? 'DELETE' : 'PUT' });
    e.currentTarget.setAttribute('aria-pressed', on ? 'false' : 'true');
  });
  document.addEventListener('keydown', e => {
    if(!$('#reader').classList.contains('open')) return;
    if(e.key === 'Escape') closeReader();
    else if(e.key === 'ArrowRight') go(reader.rtl ? -1 : 1);
    else if(e.key === 'ArrowLeft') go(reader.rtl ? 1 : -1);
  });

  /* scan + status */
  let wasScanning = false, statusTimer, lastIndexed = -1;
  $('#scanBtn').addEventListener('click', async () => {
    await api('/api/scan', { method:'POST' });
    wasScanning = true;
    pollStatus();
  });
  async function pollStatus(){
    try{
      const d = await (await api('/api/status')).json();
      const c = d.counts || {};
      const indexed = c.indexed || 0;
      $('#status').textContent = d.scanning
        ? ('Scanning… ' + indexed + ' indexed')
        : (indexed + ' indexed' + (c.error ? (' · ' + c.error + ' errors') : ''));
      if(d.scanning){
        wasScanning = true;
        if(indexed !== lastIndexed){ lastIndexed = indexed; loadList(); } // populate live as rows land
        clearTimeout(statusTimer);
        statusTimer = setTimeout(pollStatus, 1200);
      } else if(wasScanning){
        wasScanning = false;
        lastIndexed = indexed;
        loadList();
      }
    }catch(_){}
  }

  function el(tag, cls){ const e = document.createElement(tag); if(cls) e.className = cls; return e; }

  loadList();
  pollStatus();
  setInterval(() => { if(!$('#reader').classList.contains('open')) pollStatus(); }, 15000);
</script>
</body>
</html>
